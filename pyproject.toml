[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nl2sql"
version = "1.0.0"
description = "Agentic NL2SQL CLI with self-correcting query generation, LLM-as-judge evaluation, and Docker-sandboxed execution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AtharvaMate" }]
dependencies = [
    "textual>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "docker>=7.0.0",
    "rich>=13.0.0",
    "sqlglot>=23.0.0",
    "click>=8.1.0",
    "redis>=5.0.0",
    "langfuse>=2.0.0",
    "langgraph>=0.2.0",
]

[project.scripts]
nl2sql = "nl2sql.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nl2sql"]
